spring.application.name=dairydash-api

#MySQL Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dairydash_ai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

#Keep schema unchange during connection verification
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#server
server.port=8080

#Actuator health endpoint
management.endpoints.web.exposure.include=health
